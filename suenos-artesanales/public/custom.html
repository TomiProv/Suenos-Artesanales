<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido personalizado · Sueños Artesanales</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff8ee;color:#2b2b3a}header{background:linear-gradient(120deg,#e0359e,#ff6b6b,#ffc93c);color:#fff;padding:1.2rem;text-align:center}
main{max-width:560px;margin:auto;padding:1rem}input,select,textarea{width:100%;padding:.6rem;margin:.3rem 0;border:2px solid #b8f2dc;border-radius:.5rem;font:inherit}
button{background:#e0359e;color:#fff;border:0;border-radius:.6rem;padding:.7rem;font-weight:700;width:100%;cursor:pointer}#m{padding:.6rem;border-radius:.5rem;margin:.5rem 0}.ok{background:#b8f2dc}.er{background:#ffd6d6}</style><link rel="icon" href="img/favicon.png"><link rel="stylesheet" href="theme.css"></head><body>
<header><div class="brand">Sueños Artesanales</div><h1>Pedido personalizado</h1><a href="/" style="color:#fff">← Volver a la tienda</a></header>
<main><p>Contanos qué necesitás. Primero lo revisamos y te enviamos una cotización; <b>no es una compra confirmada</b>.</p>
<input id="n" placeholder="Nombre y apellido *" maxlength="100"><input id="p" placeholder="Teléfono / WhatsApp *" maxlength="30"><input id="e" type="email" placeholder="Correo (opcional)" maxlength="100">
<select id="t"><option>Acto escolar<option>Día del Maestro<option>Día del Niño<option>Día de la Madre<option>Día del Padre<option>Navidad<option>Souvenirs<option>Otro</select>
<textarea id="d" rows="5" placeholder="Describí lo que querés *" maxlength="1500"></textarea>
<input id="q" type="number" min="1" placeholder="Cantidad estimada"><input id="f" type="date"><input id="b" type="number" min="0" placeholder="Presupuesto aproximado (opcional)">
<p><small>Para fotos de referencia, enviálas por WhatsApp después de registrar el pedido.</small></p><div id="m"></div><button id="s">Enviar solicitud</button></main>
<script src="config.js"></script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp(window.FIREBASE_CONFIG)),$=s=>document.querySelector(s);let wa="5491158875660";
try{const s=await getDoc(doc(db,"settings","public"));if(s.exists()){wa=s.data().whatsapp||wa;if((s.data().eventTypes||[]).length)$("#t").replaceChildren(...s.data().eventTypes.map(x=>new Option(x,x)))}}catch(e){}
$("#s").onclick=async()=>{const n=$("#n").value.trim(),p=$("#p").value.trim(),d=$("#d").value.trim(),m=(t,c)=>{$("#m").textContent=t;$("#m").className=c};
 if(n.length<2||p.length<6||d.length<5)return m("Completá nombre, teléfono y descripción.","er");
 const id="PC-"+[...crypto.getRandomValues(new Uint8Array(8))].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("");
 try{await setDoc(doc(db,"customRequests",id),{name:n,phone:p,email:$("#e").value.slice(0,100),eventType:$("#t").value,description:d,qty:+$("#q").value||0,desiredDate:$("#f").value,budget:+$("#b").value||0,status:"nueva",createdAt:serverTimestamp()})}
 catch(e){return m("No se pudo registrar. Probá de nuevo.","er")}
 const u="https://wa.me/"+wa+"?text="+encodeURIComponent("Sueños Artesanales - Solicitud "+id+"\nNombre: "+n+"\nEvento: "+$("#t").value+"\n"+d);
 m("✅ Solicitud "+id+" registrada. Falta que envíes el mensaje por WhatsApp.","ok");$("#m").insertAdjacentHTML("beforeend",' <a href="'+u+'" target="_blank" rel="noopener">Abrir WhatsApp</a>');window.open(u,"_blank")};
</script></body></html>
